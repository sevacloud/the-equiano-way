<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Map Coming Soon — The Equiano Way</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/nav.css">
<link rel="stylesheet" href="/css/components.css">
<style>
.soon {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3rem 1.5rem;
  background: var(--teal-dark);
  color: var(--white);
}
.soon-eyebrow {
  font-family: var(--font-reading);
  font-size: 0.9rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1rem;
}
.soon-title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 6vw, 3.25rem);
  font-weight: 400;
  margin-bottom: 1.25rem;
  color: var(--white);
}
.soon-text {
  font-family: var(--font-body);
  font-size: 1.25rem;
  max-width: 34rem;
  line-height: 1.6;
  margin-bottom: 2.5rem;
  color: var(--white);
}
.soon-links {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: center;
}
.soon-links a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0.75rem 1.5rem;
  font-family: var(--font-reading);
  font-size: 1rem;
  letter-spacing: 0.05em;
  color: var(--white);
  border: 1px solid var(--gold);
  text-decoration: none;
}
.soon-links a:hover { background: rgba(196, 154, 46, 0.15); }
.soon-links a:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
<main class="soon" id="main">
  <p class="soon-eyebrow">Coming Soon&hellip;</p>
  <h1 class="soon-title">The Walking Map</h1>
  <p class="soon-text">The interactive route map is still being prepared. In the meantime, explore the route, the story of Olaudah Equiano, and plan your walk.</p>
  <nav class="soon-links" aria-label="Explore the site">
    <a href="index.html" aria-label="Return to the home page">Home</a>
    <a href="route.html" aria-label="Explore the route">The Route</a>
    <a href="equiano.html" aria-label="Read about Olaudah Equiano">Olaudah Equiano</a>
    <a href="plan.html" aria-label="Plan your walk">Plan</a>
  </nav>
</main>
</body>
</html>
